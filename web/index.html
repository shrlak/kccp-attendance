<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>KCCP 출석</title>
    <!-- Theme FOUC guard: apply the persisted (or system) theme to <html> before
         first paint, so the page doesn't flash light before the bundle hydrates. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kccp-theme')
          var theme = raw
            ? JSON.parse(raw).state.theme
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <!-- Type: SF Pro on Apple devices (native, via the system stack in index.css); Pretendard
         is the SF-matching cross-platform fallback so Android/Windows get the same clean face
         and full Korean coverage. Apple devices never download it. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
