<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="새가족 등록 카드 사진을 바로 등록합니다" />
    <!-- ── Why this page exists ────────────────────────────────────────────────
         A second home-screen entry point, for iPhones only.

         iOS doesn't implement Web Share Target, so 사진 앱 → 공유 → KCCP 출석 will
         never work there; the substitute is a home-screen icon that opens card
         registration directly. But "홈 화면에 추가" can't be pointed at the SPA's
         /share route: iOS 16.4+ reads the page's manifest and launches its
         `start_url`, so adding from /share still produced an icon that opened the
         landing page. (Older iOS captured the current URL instead — which is why
         this needs to be a real page, correct under both behaviours.)

         So: a distinct document with a distinct manifest whose `start_url` is this
         file. Adding *this* page to the home screen gives an icon that lands on
         card registration under either rule. Android is unaffected — it keeps
         using the main manifest and its share_target. -->
    <link rel="manifest" href="/share.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="새가족 카드" />
    <title>새가족 카드 등록 · KCCP</title>
    <!-- Theme FOUC guard: apply the persisted (or system) theme to <html> before
         first paint, so the page doesn't flash light before the bundle hydrates. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kccp-theme')
          var theme = raw
            ? JSON.parse(raw).state.theme
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
