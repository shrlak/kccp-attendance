name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent Pages deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Gate the frontend flip on a successful edge-function deploy so the cutover is atomic:
    # if the function deploy fails, Pages is skipped and the site stays on the previous
    # (legacy) build rather than serving React against the old function.
    needs: deploy-edge-function
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        run: |
          npm ci --prefix web
          npm --prefix web run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Stage dist
        run: |
          mkdir -p dist
          cp -r web/dist/* dist/
          # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a deep-link
          # refresh (e.g. /kccp-attendance/kiosk) loads the app and the router takes over.
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-edge-function:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Edge Function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy attendance-api --project-ref loovulhchmmwagtvjnhc --no-verify-jwt

      - name: Skip (no token configured)
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "SUPABASE_ACCESS_TOKEN secret not set — skipping Edge Function deploy. Add it in Settings → Secrets to enable auto-deploy."

  # Post a CI-success signal as a comment so a watching session is notified (the GitHub
  # integration forwards comments, but not raw CI-success events). Comments on the merged
  # PR associated with the commit, falling back to a commit comment for direct pushes.
  notify:
    needs: [deploy-edge-function, deploy]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Comment deploy success
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            const sha = context.sha
            const body = `✅ Production deploy succeeded for \`${sha.slice(0, 7)}\` — edge function + GitHub Pages are live.`
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha })
            if (prs.length > 0) {
              for (const pr of prs) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body })
              }
            } else {
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: sha, body })
            }
