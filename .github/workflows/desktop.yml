name: Desktop apps

# macOS .dmg 는 macOS 에서만, Windows .exe 는 Windows 에서 만드는 것이 가장 안전해서
# 러너를 각각 쓴다. 앱은 운영 사이트를 여는 껍데기라 web/ 이 바뀌어도 다시 만들 필요가 없다.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    paths: ['desktop/**']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, script: dist:mac, name: KCCP-macOS, glob: 'desktop/dist/*.dmg' }
          - { os: windows-latest, script: dist:win, name: KCCP-Windows, glob: 'desktop/dist/*.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.glob }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}
