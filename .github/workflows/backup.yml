name: Weekly Encrypted Backup

on:
  schedule:
    # Sundays at 17:00 in Pittsburgh. The IANA timezone keeps this at 5 PM across
    # Eastern daylight-saving and standard-time transitions.
    - cron: '0 17 * * 0'
      timezone: "America/New_York"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    # A disposable Postgres the dump gets restored into so verification never touches
    # production — the backup is only trusted once a fresh restore from it round-trips
    # back to matching row counts.
    services:
      verify_db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: aws-1-us-east-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: backup_reader.loovulhchmmwagtvjnhc
      PGPASSWORD: ${{ secrets.SUPABASE_BACKUP_DB_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "15"
      VERIFY_DB_URL: postgresql://postgres:verify@localhost:5433/postgres?sslmode=disable
      AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: kccp-attendance-backups
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets are configured
        run: |
          missing=()
          [ -z "$PGPASSWORD" ] && missing+=(SUPABASE_BACKUP_DB_PASSWORD)
          [ -z "$AGE_PUBLIC_KEY" ] && missing+=(BACKUP_AGE_PUBLIC_KEY)
          [ -z "$R2_ENDPOINT" ] && missing+=(R2_ENDPOINT)
          [ -z "$AWS_ACCESS_KEY_ID" ] && missing+=(R2_ACCESS_KEY_ID)
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && missing+=(R2_SECRET_ACCESS_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}. See docs/backup-setup.md."
            exit 1
          fi

      - name: Install age + PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y age ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Verify backup database login
        run: |
          connected_user=$(psql -X -v ON_ERROR_STOP=1 -Atc "select current_user")
          if [ "$connected_user" != "backup_reader" ]; then
            echo "::error::Expected backup_reader, connected as $connected_user."
            exit 1
          fi
          echo "Database authentication succeeded as backup_reader."

      - name: Run backup
        run: bash scripts/backup/run-backup.sh

      - name: Verify current backup and remove legacy dated copies
        run: python3 scripts/backup/prune-retention.py

      # Best-effort by design (notify.sh warns instead of failing): the backup itself
      # succeeded by this point, so a notification hiccup must not fail the run.
      - name: Send completion notifications (email / 카카오톡)
        run: bash scripts/backup/notify.sh

      - name: Open/update issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            const body = `The scheduled backup run failed.\n\n${runUrl}\n\nCheck the job log for which step failed (secret check, dump, verify-restore, encrypt, or upload) and re-run manually (workflow_dispatch) once fixed.`
            const { data: existing } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'backup-failure' })
            if (existing.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing[0].number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Weekly backup failed', body, labels: ['backup-failure'] })
            }
