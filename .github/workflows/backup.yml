name: Weekly Encrypted Backup

on:
  schedule:
    # Sundays at 17:00 in Pittsburgh. The IANA timezone keeps this at 5 PM across
    # Eastern daylight-saving and standard-time transitions. A scheduled run can't carry
    # inputs, so it backs up BOTH 부 streams (see the matrix below).
    - cron: '0 17 * * 0'
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      partition:
        description: 'Which 부 to back up'
        type: choice
        default: youth
        options: [youth, adult]
      retry:
        # Set only by the workflow itself (see "Retry once on a fresh runner") so that a
        # retry never dispatches another retry.
        description: 'Internal: this run is the automatic retry of a failed run'
        type: boolean
        default: false

permissions:
  contents: read

# Auto-backup dispatches (edge fn fires one per cooldown window after data changes)
# and the weekly cron must never interleave: current.* in R2 is overwritten in place,
# so concurrent runs could mix files from two dumps. Queue instead of cancelling —
# every dispatched run still completes, just serially. The two 부 streams write to
# different prefixes but read the same production database, so they share one queue.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 대학·청년부(backups/, 전체 스냅숏)와 장년부(backups/adult/, 장년부 데이터만)는 서로
    # 다른 백업 줄기다. 각 부서에서 데이터가 바뀌면 엣지 함수가 자기 부서 것만 깨우고
    # (workflow_dispatch + partition 입력), 주간 크론은 입력을 실을 수 없으므로 둘 다 돈다.
    strategy:
      fail-fast: false
      matrix:
        partition: >-
          ${{ github.event_name == 'schedule'
               && fromJSON('["youth","adult"]')
               || fromJSON(format('["{0}"]', inputs.partition || 'youth')) }}
    permissions:
      contents: read
      issues: write
      actions: write   # dispatch the one automatic retry
    # A disposable Postgres the dump gets restored into so verification never touches
    # production — the backup is only trusted once a fresh restore from it round-trips
    # back to matching row counts.
    services:
      verify_db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: aws-1-us-east-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: backup_reader.loovulhchmmwagtvjnhc
      PGPASSWORD: ${{ secrets.SUPABASE_BACKUP_DB_PASSWORD }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "15"
      VERIFY_DB_URL: postgresql://postgres:verify@localhost:5433/postgres?sslmode=disable
      AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: kccp-attendance-backups
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      PARTITION: ${{ matrix.partition }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check required secrets are configured
        run: |
          missing=()
          [ -z "$PGPASSWORD" ] && missing+=(SUPABASE_BACKUP_DB_PASSWORD)
          [ -z "$AGE_PUBLIC_KEY" ] && missing+=(BACKUP_AGE_PUBLIC_KEY)
          [ -z "$R2_ENDPOINT" ] && missing+=(R2_ENDPOINT)
          [ -z "$AWS_ACCESS_KEY_ID" ] && missing+=(R2_ACCESS_KEY_ID)
          [ -z "$AWS_SECRET_ACCESS_KEY" ] && missing+=(R2_SECRET_ACCESS_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}. See docs/backup-setup.md."
            exit 1
          fi

      # 도구를 내려받는 단계는 데이터와 상관없이 네트워크 하나로 깨진다 (2026-11-01: 서명 키
      # 내려받기가 2분 동안 0바이트로 멈췄다가 `curl: (56)`로 끝나 youth 백업이 통째로 빠졌다).
      # 그래서 키는 짧은 제한 시간 + 재시도로 받고, 안 되면 apt.postgresql.org의 같은 키로
      # 넘어간다. apt도 저장소를 다시 두드리게 한다.
      #
      # 재시도로는 모자랐다 (2026-11-11): 러너의 DNS가 우분투 미러(azure.archive.ubuntu.com)를
      # 12분 동안 못 찾아서 `apt-get install age`가 exit 100으로 끝났다. 그래서 평소 길은 우분투
      # 미러를 아예 지나지 않는다 — age는 Go 모듈 프록시에서 빌드하고(sum.golang.org가 내용을
      # 검증한다), apt는 apt.postgresql.org 목록만 새로 받는다. curl·ca-certificates는 러너
      # 이미지에 이미 있다. 우분투 미러는 그 길이 막혔을 때의 대비책으로만 남는다.
      - name: Install age + PostgreSQL 17 client
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          ubuntu_updated=
          ubuntu_update() {
            [ -n "$ubuntu_updated" ] && return 0
            sudo apt-get $APT update && ubuntu_updated=1
          }

          # age: Go 모듈 프록시 → 안 되면 우분투 apt.
          AGE_VERSION=v1.2.1
          if command -v go > /dev/null \
             && timeout 300 go install "filippo.io/age/cmd/age@${AGE_VERSION}"; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
            export PATH="$(go env GOPATH)/bin:$PATH"
          else
            echo "::warning::go install of age failed; falling back to the Ubuntu apt mirror."
            ubuntu_update
            sudo apt-get $APT install -y age
          fi
          age --version

          sudo install -d /usr/share/postgresql-common/pgdg
          KEY=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          fetch_key() {
            sudo curl --fail --silent --show-error --location -o "$KEY" \
              --connect-timeout 15 --max-time 60 --retry 5 --retry-delay 5 --retry-all-errors "$1"
          }
          fetch_key https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            || fetch_key https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=$KEY] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          # pgdg 목록만 새로 받는다 (다른 목록은 지우지 않고 그대로 둔다). 나머지 의존성
          # (libc·readline·ssl …)은 러너 이미지에 이미 깔려 있다. 그래도 설치가 안 되면 우분투
          # 목록까지 받고 한 번 더.
          sudo apt-get $APT update \
            -o Dir::Etc::sourcelist=sources.list.d/pgdg.list \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          if ! sudo apt-get $APT install -y postgresql-client-17; then
            echo "::warning::pgdg-only install failed; refreshing the Ubuntu lists and retrying."
            ubuntu_update
            sudo apt-get $APT install -y postgresql-client-17
          fi
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Verify backup database login
        run: |
          # A password reset in the Supabase dashboard (ALTER ROLE backup_reader …) cannot be
          # blocked — the dashboard runs as a superuser — and it silently leaves this secret
          # stale. Say so plainly instead of leaving a bare libpq error to decode.
          if ! connected_user=$(psql -X -v ON_ERROR_STOP=1 -Atc "select current_user" 2>"$RUNNER_TEMP/login.err"); then
            cat "$RUNNER_TEMP/login.err"
            if grep -q "password authentication failed" "$RUNNER_TEMP/login.err"; then
              echo "::error title=Backup password out of sync::The backup_reader password in the database no longer matches the SUPABASE_BACKUP_DB_PASSWORD GitHub secret (someone reset it in the Supabase dashboard). Fix: set a new one with ALTER ROLE backup_reader WITH PASSWORD '…' in the Supabase SQL editor, paste the same value into the GitHub secret, and re-run. See scripts/backup/README.md → Rotating a DB password."
            fi
            exit 1
          fi
          if [ "$connected_user" != "backup_reader" ]; then
            echo "::error::Expected backup_reader, connected as $connected_user."
            exit 1
          fi
          echo "Database authentication succeeded as backup_reader."

      - name: Run backup (${{ matrix.partition }})
        run: bash scripts/backup/run-backup.sh

      - name: Verify current backup and remove legacy dated copies
        run: python3 scripts/backup/prune-retention.py

      # 한 번 실패하면 새 러너에서 한 번 더 돈다. 지금까지의 실패는 전부 그 러너의 네트워크
      # 였다 (11-01 서명 키 curl, 11-11 우분투 미러 DNS) — 데이터는 멀쩡했고 다음 실행은 성공했다.
      # 이 실행 안에서 다시 돌리면 같은 러너의 같은 네트워크를 다시 두드리므로, 새 실행을 띄운다.
      # concurrency 그룹이 그것을 이 실행이 끝난 뒤로 줄 세운다. 재시도의 재시도는 없다
      # (inputs.retry), 사람이 손으로 다시 돌린 실행도 다시 띄우지 않는다 (run_attempt).
      - name: Retry once on a fresh runner
        id: retry
        if: failure() && !inputs.retry && github.run_attempt == 1
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'backup.yml', ref: context.ref,
              inputs: { partition: process.env.PARTITION || 'youth', retry: 'true' },
            })
            core.notice(`Dispatched one automatic retry of the ${process.env.PARTITION} backup.`)

      # 이슈는 재시도까지 실패했을 때(또는 재시도를 띄우지 못했을 때)만 연다 — 재시도가 성공하면
      # 사람이 할 일이 없다.
      - name: Open/update issue on failure
        if: failure() && steps.retry.outcome != 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            const partition = process.env.PARTITION || 'youth'
            const body = `The ${partition} backup run failed.\n\n${runUrl}\n\nCheck the job log for which step failed (secret check, dump, verify-restore, encrypt, or upload) and re-run manually (workflow_dispatch, partition: ${partition}) once fixed.`
            const { data: existing } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'backup-failure' })
            if (existing.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing[0].number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Weekly backup failed', body, labels: ['backup-failure'] })
            }
